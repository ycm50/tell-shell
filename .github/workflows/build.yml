name: Build Tell Shell

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (如 v1.0.0)'
        required: true
        type: string
      arch:
        description: '目标架构'
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
        default: arm64-v8a

permissions:
  contents: write

env:
  # 与本机一致的构建环境：AGP 9.2.1 + Gradle 9.4.1
  # gradle/gradle-daemon-jvm.properties 中 toolchainVersion=21，故必须使用 JDK 21
  JAVA_VERSION: '21'
  # 项目真实需要的 SDK 包（compileSdk=37 / build-tools 37.0.0）。
  # 注意：Android 37 起平台包带次版本号，**不存在** "platforms;android-37"，
  # 只有 platforms;android-37.0 / 37.1 / 37.2。本地 SDK 目录名为
  # android-37.0、android-37.1（无 android-37），故这里全部安装以确保命中。
  ANDROID_PLATFORMS: 'platforms;android-37.0 platforms;android-37.1 platforms;android-37.2'
  ANDROID_BUILD_TOOLS: 'build-tools;37.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 使用稳定的 cmdline-tools 并显式安装所需包，
      # 不再依赖 android-actions/setup-android（其安装步骤会失败）
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # ubuntu-latest 自带 SDK（通常是 /usr/local/lib/android/sdk）；
          # 若未预装则退回到自建目录。
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "使用 SDK 目录: $SDK_ROOT"

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            echo "::group::下载 command line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            rm -rf /tmp/cmdline-tools-extract
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            # sdkmanager 要求位于 cmdline-tools/<version>/ 目录结构下
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            echo "::endgroup::"
          fi

          yes | "$SDKMGR" --licenses > /dev/null || true

          echo "::group::安装 SDK 包"
          "$SDKMGR" "platform-tools" $ANDROID_PLATFORMS "$ANDROID_BUILD_TOOLS"
          echo "::endgroup::"

          echo "::group::SDK 安装结果"
          echo "platforms:"; ls -1 "$SDK_ROOT/platforms" || true
          echo "build-tools:"; ls -1 "$SDK_ROOT/build-tools" || true
          echo "::endgroup::"

          # 明确校验，避免后续构建阶段才以晦涩报错失败
          if [ ! -d "$SDK_ROOT/platforms/android-37" ] && \
             [ ! -d "$SDK_ROOT/platforms/android-37.0" ] && \
             [ ! -d "$SDK_ROOT/platforms/android-37.1" ] && \
             [ ! -d "$SDK_ROOT/platforms/android-37.2" ]; then
            echo "::error::compileSdk=37 所需的 Android 平台未成功安装"
            exit 1
          fi

      - name: Show toolchain versions
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 签名：使用仓库内的公开 keystore。
      # app/tellshell-public.jks 是各平台通用的极简公开密钥
      # （别名 key0，口令 123456，PKCS12），不含私密信息，故直接入库，
      # 无需配置任何 GitHub Secret。
      - name: Verify release keystore
        run: |
          set -euo pipefail
          KS="app/tellshell-public.jks"
          if [ ! -f "$KS" ]; then
            echo "::error::未找到签名文件 $KS"
            exit 1
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"

      - name: Build Release APK (${{ inputs.arch }})
        env:
          # 公开密钥的固定口令（非机密）
          KEYSTORE_PASSWORD: '123456'
          KEY_ALIAS: 'key0'
          KEY_PASSWORD: '123456'
        run: |
          # 本工程为纯 Kotlin/Java，无 native 代码，产物为通用 APK，
          # 因此 arch 仅用于命名标记，不做 ABI 过滤。
          ./gradlew assembleRelease \
            --no-configuration-cache --stacktrace

      - name: Rename APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$apk" ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          echo "Found APK: $apk"
          mv "$apk" "app/build/outputs/apk/release/TellShell-${{ inputs.tag }}-${{ inputs.arch }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TellShell-${{ inputs.tag }}-${{ inputs.arch }}
          path: app/build/outputs/apk/release/TellShell-${{ inputs.tag }}-${{ inputs.arch }}.apk
          if-no-files-found: error

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Tell Shell ${{ inputs.tag }}
          body: |
            ## Tell Shell ${{ inputs.tag }}

            **架构**: ${{ inputs.arch }}

            从 GitHub Actions 手动构建发布。
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/TellShell-${{ inputs.tag }}-${{ inputs.arch }}.apk
